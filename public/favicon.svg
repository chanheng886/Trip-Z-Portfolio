<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="tripz-grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10a37f" />
      <stop offset="100%" stop-color="#052922" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10a37f" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#tripz-grad)"/>
  <!-- Bus Body -->
  <rect x="14" y="14" width="36" height="34" rx="8" fill="white"/>
  <!-- Windshield -->
  <rect x="17" y="18" width="30" height="14" rx="4" fill="#0f172a"/>
  <!-- Destination sign -->
  <rect x="23" y="15" width="18" height="2" rx="1" fill="#34d399"/>
  <!-- Headlights -->
  <circle cx="21" cy="40" r="3" fill="#fbbf24"/>
  <circle cx="43" cy="40" r="3" fill="#fbbf24"/>
  <!-- Grille lines -->
  <line x1="28" y1="39" x2="36" y2="39" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <line x1="29" y1="42" x2="35" y2="42" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <!-- Wheels -->
  <rect x="18" y="47" width="8" height="5" rx="2" fill="#0f172a"/>
  <rect x="38" y="47" width="8" height="5" rx="2" fill="#0f172a"/>
</svg>